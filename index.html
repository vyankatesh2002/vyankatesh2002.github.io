*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100vh;
  height:100dvh;
  width:100%;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
body{
  font-family:var(--sans);font-size:15px;line-height:1.55;
  background:var(--desk);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  transition:background-color .5s var(--ease),color .3s var(--ease);

}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.125em;fill:currentColor;flex-shrink:0}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--line-2);
  border:3px solid transparent;
  border-radius:100px;
  background-clip:padding-box;
  transition:background .2s;
}
::-webkit-scrollbar-thumb:hover{
  background:var(--line-3);
  background-clip:padding-box;
  border:2.5px solid transparent;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

.wallpaper{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 65% 55% at 10% 5%, rgba(184,57,14,.09), transparent 55%),
    radial-gradient(ellipse 55% 65% at 92% 95%, rgba(184,57,14,.06), transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(230,220,200,.35), transparent 65%),
    var(--desk);
  transition:background .6s var(--ease);
}
[data-theme="dark"] .wallpaper{
  background:
    radial-gradient(ellipse 65% 55% at 10% 5%, rgba(239,106,46,.11), transparent 55%),
    radial-gradient(ellipse 55% 65% at 92% 95%, rgba(239,106,46,.07), transparent 60%),
    var(--desk);
}
.wallpaper::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.028) 1px, transparent 0);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse 88% 80% at 50% 50%, #000, transparent 88%);
  -webkit-mask-image:radial-gradient(ellipse 88% 80% at 50% 50%, #000, transparent 88%);
  pointer-events:none;
}
[data-theme="dark"] .wallpaper::after{
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0);
}

.grain{

}
[data-theme="dark"] .grain{opacity:.055;mix-blend-mode:screen}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

.menubar{
  position:fixed;top:0;left:0;right:0;
  height:var(--menubar-h);z-index:1000;
  background:var(--bar-bg);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:.5px solid var(--bar-border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  font-size:12.5px;
  user-select:none;
  transition:background .4s var(--ease);
  transform:translateY(-100%);
  opacity:0;
}
body.booted .menubar{
  transform:translateY(0);
  opacity:1;
  transition:
    transform .9s var(--ease-spring),
    opacity .5s var(--ease-out),
    background .4s var(--ease);
}

.menubar-left,.menubar-right{display:flex;align-items:center;gap:4px}
.menubar-center{flex:1;display:flex;justify-content:center;gap:2px}

.menubar-brand{
  font-family:var(--display);font-size:17px;font-weight:400;
  letter-spacing:-.02em;line-height:1;
  padding:3px 9px;border-radius:6px;
  color:var(--ink);
  transition:background .15s,color .15s;
}
.menubar-brand:hover{background:var(--accent-soft);color:var(--accent)}
.menubar-brand .dot{color:var(--accent);transition:color .15s}
.menubar-brand:hover .dot{color:var(--ink)}

.menu-item{
  font-size:12.5px;font-weight:500;
  padding:4px 11px;border-radius:6px;
  color:var(--ink-2);
  transition:all .18s var(--ease);
  display:flex;align-items:center;gap:5px;
  cursor:pointer;
  opacity:0;
  transform:translateY(-10px);
}
body.booted .menu-item{
  opacity:1;
  transform:translateY(0);
  transition:
    opacity .5s var(--ease-out),
    transform .5s var(--ease-out),
    background .18s var(--ease),
    color .18s var(--ease);
  transition-delay:calc(var(--mi, 0) * 55ms + 120ms), calc(var(--mi, 0) * 55ms + 120ms), 0s, 0s;
}
.menu-item:hover{background:rgba(0,0,0,.045);color:var(--ink)}
[data-theme="dark"] .menu-item:hover{background:rgba(255,255,255,.055)}
.menu-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
[data-theme="dark"] .menu-item.active{background:rgba(239,106,46,.16)}

.menubar-icon{
  width:28px;height:26px;display:grid;place-items:center;
  border-radius:6px;color:var(--ink-2);
  transition:all .18s var(--ease);
}
.menubar-icon:hover{background:rgba(0,0,0,.045);color:var(--ink)}
[data-theme="dark"] .menubar-icon:hover{background:rgba(255,255,255,.055)}
.menubar-icon svg{width:15px;height:15px}

.menubar-status{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:100px;
  border:.5px solid var(--line-2);
  font-size:11px;font-weight:500;
  color:var(--ink-2);
  font-family:var(--mono);letter-spacing:.02em;
}
.menubar-status .dot{
  width:5px;height:5px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,.2);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.2)}
  50%{box-shadow:0 0 0 4px rgba(34,197,94,.06)}
}

.menubar-clock{
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  color:var(--ink-2);padding:0 9px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}

.cmd-key{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:6px;
  border:.5px solid var(--line-2);
  background:transparent;color:var(--ink-2);
  font-size:11px;font-weight:500;
  cursor:pointer;
  transition:all .18s var(--ease);
}
.cmd-key:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft);
  transform:translateY(-1px);
}
.cmd-key svg{width:11px;height:11px}
.cmd-key kbd{
  font-family:var(--mono);font-size:10px;
  padding:1px 5px;border-radius:4px;
  background:rgba(0,0,0,.055);color:var(--ink-3);
  font-weight:500;
}
[data-theme="dark"] .cmd-key kbd{background:rgba(255,255,255,.075)}

@media(max-width:900px){
  .menubar-center{display:none}
  .menubar-status{display:none}
  .menubar-clock{display:none}
}
@media(max-width:640px){
  .menubar{padding:0 12px}
  .cmd-key kbd{display:none}
  .cmd-key{padding:3px 7px}
}

.welcome{
  position:fixed;
  top:var(--menubar-h);
  left:0;right:0;
  bottom:var(--dock-space);
  z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity .5s var(--ease-out);
}
.welcome.show{opacity:1;pointer-events:auto}

.welcome-inner{
  max-width:620px;text-align:center;
  transform:scale(.94) translateY(20px);
  transition:transform .7s var(--ease-spring);
}
.welcome.show .welcome-inner{transform:scale(1) translateY(0)}

.welcome-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:24px;
  opacity:0;transform:translateY(-8px);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out);
  transition-delay:.1s;
}
.welcome.show .welcome-kicker{opacity:1;transform:none}
.welcome-kicker::before{
  content:'';width:24px;height:1px;background:var(--accent);
}

.welcome-title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.2rem,5vw,3.8rem);
  line-height:1;letter-spacing:-.035em;
  color:var(--ink);
  margin-bottom:18px;
  opacity:0;transform:translateY(16px);
  transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);
  transition-delay:.18s;
}
.welcome.show .welcome-title{opacity:1;transform:none}
.welcome-title em{
  font-style:italic;color:var(--accent);
  font-variation-settings:"opsz" 144;
}

.welcome-desc{
  font-size:15px;color:var(--ink-2);

  margin-right:auto;

  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out);
  transition-delay:.26s;
}
.welcome.show .welcome-desc{opacity:1;transform:none}

.welcome-launchers{

  gap:12px;

}

.launcher{

  background:var(--panel-bg);
  border:.5px solid var(--panel-border);
  border-radius:14px;
  box-shadow:
    0 1px 2px rgba(0,0,0,.04),

  cursor:pointer;
  opacity:0;transform:translateY(24px) scale(.94);
}
.welcome.show .launcher{
  opacity:1;transform:none;
  transition:

    border-color .28s var(--ease-spring),
    box-shadow .28s var(--ease-spring),
    background .28s var(--ease-spring);

}
.launcher:hover{
  border-color:var(--accent);
  transform:translateY(-4px) scale(1.02);
  box-shadow:
    0 1px 2px rgba(0,0,0,.04),
    0 12px 32px -8px rgba(184,57,14,.28);

.launcher:active{transform:translateY(-2px) scale(1.0)}
.launcher svg{

  color:var(--accent);
  transition:transform .28s var(--ease-spring);
}
.launcher:hover svg{transform:scale(1.1) rotate(-4deg)}
.launcher span{

  color:var(--ink);
  letter-spacing:-.005em;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   DIRECTIONAL ANIMATION SYSTEM
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
[data-anim]{
  opacity:0;
  transition:
    opacity .8s var(--ease-out),
    transform .9s var(--ease-spring),
    filter .8s var(--ease-out);
  transition-delay:calc(var(--delay, 0) * 1ms);
  will-change:opacity, transform;
}
[data-anim="left"]{transform:translateX(-60px)}
[data-anim="right"]{transform:translateX(60px)}
[data-anim="up"]{transform:translateY(60px)}
[data-anim="down"]{transform:translateY(-60px)}
[data-anim="drop"]{transform:translateY(-80px) scale(.94);filter:blur(8px)}
[data-anim="rise"]{transform:translateY(80px) scale(.96)}
[data-anim="scale"]{transform:scale(.82)}
[data-anim="swipe-l"]{clip-path:inset(0 100% 0 0);opacity:1;transform:none;transition:clip-path .9s var(--ease-out)}
[data-anim="swipe-r"]{clip-path:inset(0 0 0 100%);opacity:1;transform:none;transition:clip-path .9s var(--ease-out)}
[data-anim="flip"]{transform:perspective(800px) rotateX(-30deg);transform-origin:top center}
[data-anim].in{
  opacity:1;
  transform:none;
  filter:none;
  clip-path:inset(0);
  will-change:auto;
}

@media(prefers-reduced-motion:reduce){
  [data-anim]{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .menubar,.menu-item,.dock,.dock-item,.launcher,.welcome-inner{transition:none!important;opacity:1!important;transform:none!important}
}

   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.dock{
  position:fixed;
  bottom:14px;left:50%;
  transform:translateX(-50%) translateY(120px);
  z-index:100;
  background:var(--dock-bg);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--dock-border);
  border-radius:18px;
  padding:9px;
  display:flex;align-items:flex-end;gap:5px;
  box-shadow:
    0 20px 48px rgba(0,0,0,.22),
    0 6px 16px rgba(0,0,0,.1),
    inset 0 1px 0 rgba(255,255,255,.25);
  opacity:0;
  transition:
    transform .9s var(--ease-spring) .2s,
    opacity .5s var(--ease-out) .2s,
    background .3s var(--ease);
}
body.booted .dock{transform:translateX(-50%) translateY(0);opacity:1}
[data-theme="dark"] .dock{
  box-shadow:
    0 20px 48px rgba(0,0,0,.55),
    0 6px 16px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.06);
}
@media(max-width:720px){
  .dock{bottom:10px;padding:6px;gap:4px;border-radius:14px}
}

.dock-item{
  width:46px;height:46px;
  border-radius:12px;
  display:grid;place-items:center;
  position:relative;
  background:var(--paper);
  border:.5px solid var(--panel-border);
  cursor:pointer;
  transform-origin:bottom center;
  transition:
    transform .22s var(--ease-spring),
    background .18s,
    border-color .18s;
  box-shadow:
    0 1px 3px rgba(0,0,0,.05),
    inset 0 1px 0 rgba(255,255,255,.4);
}
[data-theme="dark"] .dock-item{
  background:rgba(40,36,28,.9);
  box-shadow:
    0 1px 3px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.dock-item svg{
  width:20px;height:20px;
  color:var(--ink-2);
  transition:color .18s,transform .22s var(--ease-spring);
}

  background:var(--accent-soft);
  border-color:var(--accent);
}

.dock-item::after{
  content:attr(data-label);
  position:absolute;
  bottom:calc(100% + 12px);
  left:50%;transform:translateX(-50%) translateY(4px);
  padding:5px 11px;border-radius:7px;
  background:rgba(15,12,8,.94);
  color:#fff;
  font-size:11px;font-weight:500;

  transition:opacity .2s,transform .2s var(--ease-spring);
  box-shadow:0 6px 16px rgba(0,0,0,.25);
  z-index:1;
  letter-spacing:-.005em;
}

.dock-item.active::before{
  content:'';
  position:absolute;
  bottom:-8px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px rgba(184,57,14,.5);

}

  0%,100%{opacity:1;transform:translateX(-50%) scale(1)}

}

.spotlight{

}

}

<script>
(function(){
  'use strict';

  var $ = function(s,c){return (c||document).querySelector(s)};
  var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.documentElement;

  var apps = {
    home:    { title: 'Home',    icon: 'i-home',    template: 'tpl-home',    tag: 'Portfolio' },
    about:   { title: 'About',   icon: 'i-user',    template: 'tpl-about',   tag: 'Notes' },
    skills:  { title: 'Skills',  icon: 'i-terminal',template: 'tpl-skills',  tag: 'Capabilities' },
    work:    { title: 'Work',    icon: 'i-folder',  template: 'tpl-work',    tag: 'Projects' },
    path:    { title: 'Path',    icon: 'i-calendar',template: 'tpl-path',    tag: 'Timeline' },
    contact: { title: 'Contact', icon: 'i-mail',    template: 'tpl-contact', tag: 'Message' }
  };
  var appOrder = ['home','about','skills','work','path','contact'];
  var currentApp = null;

  requestAnimationFrame(function(){ document.body.classList.add('booted'); });

  /* THEME */
  var themeBtn = $('#theme-toggle');
  var themeIcon = $('#theme-icon');
  function applyTheme(t){
    root.setAttribute('data-theme', t);
    themeIcon.querySelector('use').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
    try { localStorage.setItem('theme', t); } catch(e){}
  }
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e){}
  if (!saved) saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(saved);
  themeBtn.addEventListener('click', function(){
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    if (e.key.toLowerCase() !== 't') return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    themeBtn.click();
  });

  /* CLOCK */
  var clock = $('#clock');
  function tick(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var am = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clock.textContent = h + ':' + String(m).padStart(2,'0') + ' ' + am;
  }
  tick();
  setInterval(tick, 30000);

  /* WINDOW / APP */
  var win = $('#window');
  var winBody = $('#window-body');
  var winTitle = $('#window-title-text');
  var winTitleIcon = $('#window-title-icon');
  var winTitleTag = $('#window-title-tag');
  var winProgress = $('#window-progress');
  var welcome = $('#welcome');
  var dockItems = $$('.dock-item[data-app]');
  var menuItems = $$('.menu-item[data-app]');

  function setActive(id){
    dockItems.forEach(function(d){ d.classList.toggle('active', d.dataset.app === id); });
    menuItems.forEach(function(m){ m.classList.toggle('active', m.dataset.app === id); });
  }

  function updateScrollIndicators(){
    if (!winBody) return;
    var top = winBody.scrollTop;
    var max = winBody.scrollHeight - winBody.clientHeight;
    var atTop = top <= 2;
    var atBottom = top >= max - 2;
    var atMiddle = !atTop && !atBottom && max > 40;
    winBody.classList.toggle('scroll-middle', atMiddle);
    if (winProgress){
      var pct = max > 0 ? Math.min(100, (top / max) * 100) : 0;
      winProgress.style.width = pct + '%';
    }
  }
  winBody.addEventListener('scroll', updateScrollIndicators, { passive: true });
  window.addEventListener('resize', updateScrollIndicators, { passive: true });

  var animMap = {
    home: [
      {sel: '.home-kicker', anim: 'left',  d: 120},
      {sel: '.home-name',   anim: 'drop',  d: 180},
      {sel: '.home-role',   anim: 'up',    d: 280},
      {sel: '.home-bio',    anim: 'up',    d: 350},
      {sel: '.home-ctas',   anim: 'up',    d: 430},
      {sel: '.home-socials',anim: 'up',    d: 510},
      {sel: '.home-portrait',anim:'right', d: 260}
    ],
    about: [
      {sel: '.app-head',      anim: 'left', d: 100},
      {sel: '.about-lead',    anim: 'up',   d: 220},
      {sel: '.about-copy p',  anim: 'up',   d: 300, stagger: 100},
      {sel: '.about-sidebar', anim: 'right',d: 240},
      {sel: '.stat',          anim: 'rise', d: 400, stagger: 80}
    ],
    skills: [
      {sel: '.app-head',  anim: 'left', d: 100},
      {sel: '.app-head .sub', anim: 'right', d: 160},
      {sel: '.skill',     anim: 'drop', d: 220, stagger: 90}
    ],
    work: [
      {sel: '.app-head',       anim: 'left', d: 100},
      {sel: '.work-filters',   anim: 'up',   d: 220},
      {sel: '.proj',           anim: 'up',   d: 300, stagger: 90, alternate: true}
    ],
    path: [
      {sel: '.app-head',        anim: 'left',  d: 100},
      {sel: '.path-col:nth-child(1)', anim: 'left',  d: 220},
      {sel: '.path-col:nth-child(2)', anim: 'right', d: 320},
      {sel: '.tl-item',         anim: 'up',    d: 400, stagger: 80}
    ],
    contact: [
      {sel: '.app-head',        anim: 'left',  d: 100},
      {sel: '.contact-lead',    anim: 'up',    d: 220},
      {sel: '.field',           anim: 'up',    d: 300, stagger: 90},
      {sel: '.contact-form button', anim: 'up',d: 620},
      {sel: '.contact-side',    anim: 'right', d: 240}
    ]
  };

  function assignAnimations(appId){
    var contentRoot = winBody.firstElementChild;
    if (!contentRoot) return;
    var map = animMap[appId] || [];
    map.forEach(function(rule){
      var els = $$(rule.sel, contentRoot);
      els.forEach(function(el, idx){
        var anim = rule.anim;
        if (rule.alternate && idx % 2 === 1){
          anim = anim === 'left' ? 'right' : (anim === 'right' ? 'left' : anim);
        }
        el.setAttribute('data-anim', anim);
        var delay = (rule.d || 0) + (rule.stagger ? idx * rule.stagger : 0);
        el.style.setProperty('--delay', delay);
      });
    });

    requestAnimationFrame(function(){
      var bodyRect = winBody.getBoundingClientRect();
      $$('[data-anim]', contentRoot).forEach(function(el){
        var r = el.getBoundingClientRect();
        var visible = r.top < bodyRect.bottom - 20 && r.bottom > bodyRect.top;
        if (!visible) el.style.setProperty('--delay', 0);
      });

      if (reduce){
        $$('[data-anim]', contentRoot).forEach(function(el){ el.classList.add('in'); });
      } else if ('IntersectionObserver' in window){
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(en){
            if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
          });
        }, { root: winBody, threshold: 0.05, rootMargin: '0px 0px -6% 0px' });
        $$('[data-anim]', contentRoot).forEach(function(el){ io.observe(el); });
      } else {
        $$('[data-anim]', contentRoot).forEach(function(el){ el.classList.add('in'); });
      }
    });
  }

  function injectContent(app, appId){
    winBody.innerHTML = '';
    var tpl = document.getElementById(app.template);
    if (!tpl) return;
    winBody.appendChild(tpl.content.cloneNode(true));

    winTitle.textContent = app.title;
    winTitleIcon.querySelector('use').setAttribute('href', '#' + app.icon);
    winTitleTag.textContent = app.tag;
    winProgress.style.width = '0%';

    afterInject(app);
    assignAnimations(appId);

    requestAnimationFrame(updateScrollIndicators);
    setTimeout(updateScrollIndicators, 140);
  }

  function openApp(id){
    var app = apps[id];
    if (!app) return;
    if (currentApp === id){ closeWindow(); return; }
    var wasOpen = win.classList.contains('open');
    currentApp = id;

    if (!wasOpen){
      injectContent(app, id);
      winBody.scrollTop = 0;
      welcome.classList.remove('show');
      requestAnimationFrame(function(){ win.classList.add('open'); });
    } else {
      winBody.style.opacity = '0';
      setTimeout(function(){
        injectContent(app, id);
        winBody.scrollTop = 0;
        winBody.style.opacity = '1';
        updateScrollIndicators();
      }, 140);
    }
    setActive(id);
    winBody.classList.toggle('no-scroll', id === 'home');
  }

  function closeWindow(){
    if (!win.classList.contains('open')) return;
    win.classList.remove('open');
    setActive(null);
    currentApp = null;
    setTimeout(function(){ welcome.classList.add('show'); }, 220);
  }

  document.addEventListener('click', function(e){
    var appBtn = e.target.closest('[data-app]');
    if (appBtn){
      var href = appBtn.getAttribute && appBtn.getAttribute('href');
      if (href && href.indexOf('http') === 0) return;
      e.preventDefault();
      openApp(appBtn.dataset.app);
    }
  });

  win.addEventListener('click', function(e){
    var action = e.target.closest('[data-action]');
    if (!action) return;
    if (action.dataset.action === 'close') closeWindow();
    if (action.dataset.action === 'minimize') closeWindow();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && win.classList.contains('open') && !$('#spotlight').classList.contains('open')){
      closeWindow();
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 6){ e.preventDefault(); openApp(appOrder[n - 1]); }
  });

  function afterInject(){
    var filters = $$('.filter');
    var cards = $$('.proj');
    var workCount = $('#work-count');
    if (filters.length){
      filters.forEach(function(btn){
        btn.addEventListener('click', function(){
          var f = btn.dataset.filter;
          filters.forEach(function(b){ b.classList.toggle('active', b === btn); });
          var shown = 0;
          cards.forEach(function(card){
            var cats = (card.dataset.cats || '').split(',');
            var show = f === 'all' || cats.indexOf(f) > -1;
            if (show){
              card.style.display = '';
              card.style.opacity = '0';
              card.style.transform = 'translateY(8px)';
              requestAnimationFrame(function(){
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
              });
              shown++;
            } else { card.style.display = 'none'; }
          });
          if (workCount) workCount.textContent = shown + ' project' + (shown === 1 ? '' : 's');
          setTimeout(updateScrollIndicators, 340);
        });
      });
    }

    var statEls = $$('.stat-item [data-count], .stat [data-count]');
    if (statEls.length && !reduce){
      statEls.forEach(function(el){
        var target = parseInt(el.dataset.count, 10);
        el.textContent = '0';
        var dur = 1400, t0 = performance.now();
        (function step(now){
          var p = Math.min((now - t0) / dur, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * eased);
          if (p < 1) requestAnimationFrame(step);
          else el.textContent = target;
        })(performance.now());
      });
    }

    var roleEl = $('#role');
    if (roleEl){
      var roles = ['AI / ML Engineer','Full-stack Developer','Product Builder','Systems Thinker'];
      if (reduce){ roleEl.textContent = roles[0]; }
      else {
        var ri = 0, ci = 0, del = false;
        (function tickRole(){
          var cur = roles[ri];
          if (!del){
            ci++;
            roleEl.textContent = cur.slice(0, ci);
            if (ci === cur.length){ del = true; return setTimeout(tickRole, 1800); }
            return setTimeout(tickRole, 55);
          }
          ci--;
          roleEl.textContent = cur.slice(0, ci);
          if (ci === 0){ del = false; ri = (ri + 1) % roles.length; return setTimeout(tickRole, 260); }
          setTimeout(tickRole, 30);
        })();
      }
    }

    var copyBtn = $('#copy-email');
    if (copyBtn){
      copyBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        copyText('vyankateshvjaware2002@gmail.com', function(){
          var orig = copyBtn.innerHTML;
          copyBtn.innerHTML = '<svg width="11" height="11"><use href="#i-check"/></svg>';
          copyBtn.classList.add('copied');
          showToast('Email copied to clipboard');
          setTimeout(function(){
            copyBtn.innerHTML = orig;
            copyBtn.classList.remove('copied');
          }, 1500);
        });
      });
    }

    var form = $('#contact-form');
    if (form){
      form.addEventListener('submit', function(e){
        e.preventDefault();
        $$('.field-error', form).forEach(function(el){ el.remove(); });
        $$('.field', form).forEach(function(el){ el.classList.remove('error'); });
        var name = $('#f-name'), email = $('#f-email'), msg = $('#f-msg');
        var ok = true;
        function err(field, m){
          field.closest('.field').classList.add('error');
          var el = document.createElement('div');
          el.className = 'field-error';
          el.textContent = m;
          field.closest('.field').appendChild(el);
        }
        if (!name.value.trim()){ err(name, 'Please enter your name'); ok = false; }
        if (!email.value.trim()){ err(email, 'Please enter your email'); ok = false; }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())){ err(email, 'Enter a valid email'); ok = false; }
        if (!msg.value.trim()){ err(msg, 'Please write a message'); ok = false; }
        if (!ok){ var f = form.querySelector('.field.error input, .field.error textarea'); if (f) f.focus(); return; }
        var subj = encodeURIComponent('Portfolio enquiry from ' + name.value.trim());
        var body = encodeURIComponent(msg.value.trim() + '\n\nâ€” ' + name.value.trim() + '\n' + email.value.trim());
        location.href = 'mailto:vyankateshvjaware2002@gmail.com?subject=' + subj + '&body=' + body;
      });
    }
  }

  var toast = $('#toast');
  var toastMsg = $('#toast-msg');
  var toastTimer;
  function showToast(msg){
    if (!toast) return;
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }
  function copyText(text, cb){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(cb, function(){ fallback(text, cb); });
    } else { fallback(text, cb); }
    function fallback(t, cb2){
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(err){}
      document.body.removeChild(ta);
      cb2();
    }
  }

  (function(){
    var dock = $('#dock');
    if (!dock || matchMedia('(hover: none)').matches || innerWidth < 720) return;
    var items = $$('.dock-item', dock);
    dock.addEventListener('mousemove', function(e){
      items.forEach(function(item){
        var r = item.getBoundingClientRect();
        var center = r.left + r.width / 2;
        var dist = Math.abs(e.clientX - center);
        var scale = Math.max(1, 1.55 - dist / 240);
        var ty = -(scale - 1) * 24;
        item.style.transform = 'translateY(' + ty + 'px) scale(' + scale + ')';
      });
    });
    dock.addEventListener('mouseleave', function(){
      items.forEach(function(item){ item.style.transform = ''; });
    });
  })();

  (function(){
    var overlay = $('#spotlight');
    var input = $('#spotlight-input');
    var results = $('#spotlight-results');
    var items = [
      { title: 'Home', meta: 'App', target: 'app:home', icon: 'i-home' },
      { title: 'About', meta: 'App', target: 'app:about', icon: 'i-user' },
      { title: 'Skills', meta: 'App', target: 'app:skills', icon: 'i-terminal' },
      { title: 'Work', meta: 'App', target: 'app:work', icon: 'i-folder' },
      { title: 'Path', meta: 'App', target: 'app:path', icon: 'i-calendar' },
      { title: 'Contact', meta: 'App', target: 'app:contact', icon: 'i-mail' },
      { title: 'SevaSetu', meta: 'Project', target: 'https://vyankatesh2002.github.io/SevaSetu.com/', icon: 'i-code' },
      { title: 'Prabhune Diamonds', meta: 'Project', target: 'https://prabhunediamond.com/', icon: 'i-sparkle' },
      { title: 'Vandvik AI', meta: 'Project', target: 'https://vyankatesh2002.github.io/Vandvik.com/', icon: 'i-code' },
      { title: 'Vynora', meta: 'Project', target: 'https://vyankatesh2002.github.io/vynora/', icon: 'i-sparkle' },
      { title: 'Smart Calculator', meta: 'Project', target: 'https://vyankatesh2002.github.io/Calculator/', icon: 'i-code' },
      { title: 'To-Do Pro', meta: 'Project', target: 'https://vyankatesh2002.github.io/To-Do-List/', icon: 'i-check' },
      { title: 'CLD Club', meta: 'Project', target: 'https://vyankatesh2002.github.io/CLD-club/', icon: 'i-user' },
      { title: 'MediMind', meta: 'Project', target: 'https://github.com/vyankatesh2002/MediMind', icon: 'i-sparkle' },
      { title: 'GitHub', meta: 'Profile', target: 'https://github.com/vyankatesh2002', icon: 'i-gh' },
      { title: 'LinkedIn', meta: 'Profile', target: 'https://www.linkedin.com/in/vyankatesh-jaware-0397a325a', icon: 'i-li' }
    ];
    var focused = 0;
    var filtered = items.slice();

    function render(q){
      q = (q || '').toLowerCase().trim();
      filtered = q ? items.filter(function(it){
        return it.title.toLowerCase().indexOf(q) > -1 || it.meta.toLowerCase().indexOf(q) > -1;
      }) : items;
      focused = 0;
      if (!filtered.length){
        results.innerHTML = '<div class="spotlight-empty">No results for "' + escapeHtml(q) + '"</div>';
        return;
      }
      results.innerHTML = filtered.map(function(it, i){
        return '<div class="spotlight-result' + (i === 0 ? ' focused' : '') + '" data-idx="' + i + '">' +
          '<svg><use href="#' + it.icon + '"/></svg>' +
          '<span>' + it.title + '</span>' +
          '<span class="meta">' + it.meta + '</span>' +
          '</div>';
      }).join('');
      $$('.spotlight-result', results).forEach(function(el){
        el.addEventListener('mouseenter', function(){ focused = parseInt(el.dataset.idx, 10); updateFocus(); });
        el.addEventListener('click', function(){ activate(focused); });
      });
    }
    function updateFocus(){
      $$('.spotlight-result', results).forEach(function(el, i){
        el.classList.toggle('focused', i === focused);
      });
    }
    function activate(idx){
      var it = filtered[idx];
      if (!it) return;
      close();
      if (it.target.indexOf('app:') === 0){ openApp(it.target.slice(4)); }
      else { window.open(it.target, '_blank', 'noopener'); }
    }
    function open(){
      overlay.classList.add('open');
      input.value = '';
      render('');
      setTimeout(function(){ input.focus(); }, 50);
    }
    function close(){ overlay.classList.remove('open'); }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    var openBtn = $('#cmd-open');
    if (openBtn) openBtn.addEventListener('click', open);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    input.addEventListener('input', function(){ render(input.value); });
    document.addEventListener('keydown', function(e){
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault();
        if (overlay.classList.contains('open')) close();
        else open();
        return;
      }
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape'){ close(); }
      else if (e.key === 'ArrowDown'){
        e.preventDefault();
        focused = Math.min(focused + 1, filtered.length - 1);
        updateFocus();
        var el = results.querySelector('.focused');
        if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      else if (e.key === 'ArrowUp'){
        e.preventDefault();
        focused = Math.max(focused - 1, 0);
        updateFocus();
        var el2 = results.querySelector('.focused');
        if (el2) el2.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      else if (e.key === 'Enter'){ e.preventDefault(); activate(focused); }
    });
  })();

  setTimeout(function(){ openApp('home'); }, 320);

})();
</script>
</body>
</html>
